name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Embedded Python & FFmpeg
        run: |
          python scripts/prepare_embedded_python.py

      - name: Build Portable Release Package
        run: |
          python scripts/create_distribution_zip.py

      - name: Determine Release Tag & Extract Release Notes
        id: vars
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref = os.environ.get("GITHUB_REF", "")
          tag = "${{ github.event.inputs.tag_name }}" if event_name == "workflow_dispatch" else ref.replace("refs/tags/", "")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
          sys.path.insert(0, "scripts")
          import publish_release
          notes = publish_release.extract_changelog_for_tag(tag) or f"⚡ VFXEdu CorridorKey 2.0 {tag} 최신 업데이트 릴리즈"
          body = (
              f"## ⚡ VFXEdu CorridorKey 2.0 {tag} Update\n\n"
              f"> **간편 업데이트 안내**: 기존 사용자는 `Update.bat`을 실행하거나 GUI 화면에서 **[Update Now (Fast Patch)]**를 누르면 5~10초 만에 최신 코드로 자동 패치됩니다.\n\n"
              f"---\n\n{notes}\n\n---\n\n"
              f"*모든 이전 버전과 릴리즈 내역은 GitHub에 영구 보존됩니다.*\n"
          )
          Path("release_notes.md").write_text(body, encoding="utf-8")

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: VFXEdu CorridorKey 2.0 ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            dist/CorridorKeyer2.0_Portable_Setup.zip
            dist/CorridorKeyer2.0_Portable_Setup.zip.sha256
