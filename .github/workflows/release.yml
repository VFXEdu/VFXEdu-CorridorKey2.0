name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Embedded Python & FFmpeg
        run: |
          python scripts/prepare_embedded_python.py

      - name: Build Portable Release Package
        run: |
          python scripts/create_distribution_zip.py

      - name: Determine Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: VFXEdu CorridorKey 2.0 ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ⚡ VFXEdu CorridorKey 2.0 ${{ steps.vars.outputs.tag }} Update

            > 기존 사용자는 `Update.bat` 실행 또는 GUI 화면에서 **[Update Now]**를 누르면 5~10초 만에 최신 코드로 자동 패치됩니다.
          files: |
            dist/CorridorKeyer2.0_Portable_Setup.zip
            dist/CorridorKeyer2.0_Portable_Setup.zip.sha256
